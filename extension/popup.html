<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Instant Translate</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0; padding: 14px 16px; width: 250px;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif;
    }
    h1 { font-size: 14px; margin: 0 0 12px; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; }
    select { font: inherit; max-width: 140px; }
    .hint { color: GrayText; font-size: 11.5px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Instant Translate</h1>
  <label>Переводить при выделении <input type="checkbox" id="enabled"></label>
  <label>Переводить на <select id="primary"></select></label>
  <label>Если текст уже на нём <select id="secondary"></select></label>
  <p class="hint">Выделите текст на странице, и перевод появится рядом. Esc или клик мимо окна закрывает его.</p>
  <script src="popup.js"></script>
</body>
</html>
