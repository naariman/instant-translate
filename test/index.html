<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Instant Translate — test page</title>
  <style>
    body { font: 16px/1.6 -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; }
  </style>
  <script>
    // Заглушка API расширения: тот же код background.js и content.js, без Safari.
    const listeners = [];
    const store = {};
    globalThis.chrome = {
      runtime: {
        lastError: undefined,
        onMessage: { addListener: (fn) => listeners.push(fn) },
        sendMessage: (msg, cb) => { listeners.forEach((fn) => fn(msg, {}, cb)); },
      },
      storage: {
        local: {
          get: (defaults, cb) => cb({ ...defaults, ...store }),
          set: (obj) => Object.assign(store, obj),
        },
        onChanged: { addListener: () => {} },
      },
    };
  </script>
  <script src="../extension/background.js"></script>
  <script src="../extension/content.js"></script>
</head>
<body>
  <h1>Test page</h1>
  <p id="en">The quick brown fox jumps over the lazy dog. Select any part of this sentence to see the translation.</p>
  <p id="ru">Быстрая коричневая лиса перепрыгивает через ленивую собаку.</p>
  <p id="kk">Сәлеметсіз бе, қалыңыз қалай?</p>
  <textarea id="ta" rows="3" cols="60">Selected text inside a textarea should also be translated.</textarea>
</body>
</html>
